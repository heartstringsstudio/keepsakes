<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Keepsake Not Found · Heartstrings Studio</title>
  <!-- GitHub Pages serves this for any missing path under /keepsakes/ —
       usually a mistyped or truncated keepsake link from a text or a
       Facebook comment. All URLs must be absolute. -->
  <link rel="icon" type="image/png" href="https://heartstringsstudio.github.io/heartstringsstudio/favicon.png" />
  <style>
    :root { --charcoal:#1a1416; --cream:#faf6f2; --rose:#c0455a; --rose-light:#d4637a; --muted:#7a6668; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--cream);
      color: #3a2e30;
      font-family: 'Lato', system-ui, sans-serif;
      text-align: center;
      line-height: 1.7;
    }
    main { max-width: 560px; }
    img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 1rem; }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 500;
      font-size: clamp(1.9rem, 6vw, 2.8rem);
      color: var(--charcoal);
      margin-bottom: 0.75rem;
    }
    h1 em { font-style: italic; color: var(--rose); }
    p { color: var(--muted); margin-bottom: 1.75rem; }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    a.btn {
      display: inline-block;
      padding: 0.85rem 1.6rem;
      color: var(--cream);
      background: var(--rose);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: background 0.25s ease;
    }
    a.btn:hover { background: var(--rose-light); }
    a.btn.quiet { background: transparent; color: var(--rose); border: 1px solid rgba(192,69,90,0.45); }
    a.btn.quiet:hover { background: rgba(192,69,90,0.08); }
    a:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="https://heartstringsstudio.github.io/heartstringsstudio/logo.png" alt="" width="512" height="512" />
    <h1>That keepsake link isn't <em>quite right.</em></h1>
    <p>Keepsake links are long on purpose — check that the whole thing made it into your browser, or ask the person who shared it to send it again. The song is safe and waiting.</p>
    <div class="links">
      <a class="btn" href="https://heartstringsstudio.github.io/heartstringsstudio/">Visit the studio</a>
      <a class="btn quiet" href="mailto:heartstringsstudiowv@gmail.com">Email us for help</a>
    </div>
  </main>
</body>
</html>
